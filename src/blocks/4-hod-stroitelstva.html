<!--meta
title: Ход строительства
url: /hod-stroitelstva
-->
<style>
/* Карточки 451×365, фото 451×307, подпись SemiBold 20 */
.zm-build .zm-filters { margin: 40px 0 40px; }
@media (min-width: 981px) { .zm-top__row .zm-build__lead { flex-basis: 279px; } }
.zm-build-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px 24px; }
.zm-build-card { display: flex; flex-direction: column; border-radius: 8px; overflow: hidden; background: var(--zm-card); text-align: left; transition: background .25s, color .25s; }
.zm-build-card__img { aspect-ratio: 451 / 307; overflow: hidden; background: #d8dbe6; }
.zm-build-card__img img { width: 100%; height: 100%; object-fit: cover; transition: transform .5s; }
.zm-build-card__foot { display: flex; justify-content: space-between; gap: 10px; padding: 19px 20px 20px; font-size: 20px; line-height: 19px; font-weight: 600; letter-spacing: 0; }
.zm-build-card__foot span { opacity: .5; }
.zm-build-card:hover { background: var(--zm-navy); color: #fff; }
.zm-build-card:hover img { transform: scale(1.03); }
.zm-build-empty { grid-column: 1 / -1; padding: 40px 0; color: var(--zm-muted); font-size: 18px; }
@media (max-width: 980px) { .zm-build-grid { grid-template-columns: 1fr 1fr; gap: 16px; } .zm-build-card__foot { font-size: 16px; } }
@media (max-width: 640px) {
  .zm-build .zm-filters { margin: 24px 0; }
  .zm-build-grid { grid-template-columns: 1fr; gap: 12px; }
  .zm-build-card__img { aspect-ratio: 351 / 270; }
  .zm-build-card__foot { padding: 16px; font-size: 14px; }
}
</style>

<div class="zm" id="zm-build-page">
  <section class="zm-container zm-top zm-build zm-section--last">
    <nav class="zm-crumbs" aria-label="Хлебные крошки"><a href="/">Главная</a><span>Ход строительства</span></nav>
    <div class="zm-top__row">
      <h1 class="zm-h1">Ход строительства</h1>
      <p class="zm-lead zm-build__lead">Актуальные фотоотчёты строительства ЖК&nbsp;«Московский»</p>
    </div>
    <div class="zm-filters">
      <div class="zm-select"><select data-f="year" aria-label="Год"><option value="">Год</option></select></div>
      <div class="zm-select"><select data-f="month" aria-label="Месяц"><option value="">Месяц</option></select></div>
    </div>
    <div class="zm-build-grid" data-grid></div>
  </section>
</div>

<script>
(function () {
  /* ======== ДАННЫЕ ========
     Фотоотчёты берутся из «Потока» Tilda, где они ведутся сейчас (FEED_UID — id потока).
     Если поток недоступен — показывается список REPORTS ниже. Новые месяцы проще всего добавлять в поток;
     без потока — добавьте объект в начало REPORTS: { title: 'Июль 2026', photos: ['ссылка1', 'ссылка2', ...] } */
  var FEED_UID = '924680363231';
  var REPORTS = [
    { title: 'Август 2026',  photos: ['{{img:build-2026-08}}'] },
    { title: 'Июль 2026',    photos: ['{{img:build-2026-07}}'] },
    { title: 'Июнь 2026',    photos: ['{{img:build-2026-06}}', 'https://static.tildacdn.com/tild3632-3664-4164-a363-303636613366/obj69122_photo2026-0.jpeg'] },
    { title: 'Май 2026',     photos: ['{{img:build-2026-05}}', 'https://static.tildacdn.com/tild6265-3339-4836-a132-663562323764/obj69122_photo2026-0.jpeg'] },
    { title: 'Апрель 2026',  photos: ['{{img:build-2026-04}}', 'https://static.tildacdn.com/tild6336-3339-4035-b065-366336356538/obj69122_photo2026-0.jpeg'] },
    { title: 'Март 2026',    photos: ['{{img:build-2026-03}}', 'https://static.tildacdn.com/tild3338-3038-4738-b936-613438366433/obj69122_photo2026-0.jpeg'] },
    { title: 'Февраль 2026', photos: ['{{img:build-2026-02}}', 'https://static.tildacdn.com/tild3966-6436-4936-b966-313836633334/EE6E534A214B4C10AC27.jpg'] },
    { title: 'Январь 2026',  photos: ['{{img:build-2026-01}}', 'https://static.tildacdn.com/tild6433-6162-4432-a133-386639626433/E527B36BC4474E66BB00.jpg'] },
    { title: 'Декабрь 2025', photos: ['{{img:build-2025-12}}', 'https://static.tildacdn.com/tild3463-3335-4332-b332-393365653833/__2026-02-18__123721.png'] }
  ];
  /* ========================= */

  var root = document.getElementById('zm-build-page');
  if (!root || root.__build) return; root.__build = 1;
  var MONTHS = ['январь', 'февраль', 'март', 'апрель', 'май', 'июнь', 'июль', 'август', 'сентябрь', 'октябрь', 'ноябрь', 'декабрь'];
  var grid = root.querySelector('[data-grid]');
  var selY = root.querySelector('[data-f="year"]');
  var selM = root.querySelector('[data-f="month"]');
  var items = [];

  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  function normalize(list) {
    return list.map(function (r) {
      var t = String(r.title).toLowerCase();
      var y = (t.match(/(20\d\d)/) || [])[1];
      var m = -1;
      MONTHS.forEach(function (name, i) { if (m < 0 && new RegExp('(^|\\s)' + name.slice(0, 3)).test(t)) m = i; });
      return { title: m > -1 && y ? cap(MONTHS[m]) + ' ' + y : r.title, year: y || '', month: m, photos: (r.photos || []).filter(Boolean) };
    }).filter(function (r) { return r.photos.length; })
      .sort(function (a, b) { return (b.year * 12 + b.month) - (a.year * 12 + a.month); });
  }

  function fillFilters() {
    var years = [];
    items.forEach(function (r) { if (r.year && years.indexOf(r.year) < 0) years.push(r.year); });
    selY.innerHTML = '<option value="">Год</option>' + years.map(function (y) { return '<option>' + y + '</option>'; }).join('');
    fillMonths();
  }
  function fillMonths() {
    var y = selY.value, ms = [];
    items.forEach(function (r) { if ((!y || r.year === y) && r.month > -1 && ms.indexOf(r.month) < 0) ms.push(r.month); });
    ms.sort(function (a, b) { return a - b; });
    var cur = selM.value;
    selM.innerHTML = '<option value="">Месяц</option>' + ms.map(function (m) { return '<option value="' + m + '">' + cap(MONTHS[m]) + '</option>'; }).join('');
    if (ms.indexOf(+cur) > -1 && cur !== '') selM.value = cur;
  }

  function render() {
    var y = selY.value, m = selM.value;
    var list = items.filter(function (r) { return (!y || r.year === y) && (m === '' || r.month === +m); });
    grid.innerHTML = list.length ? list.map(function (r) {
      var i = items.indexOf(r);
      return '<button class="zm-build-card" type="button" data-i="' + i + '">' +
        '<div class="zm-build-card__img"><img src="' + r.photos[0] + '" alt="Ход строительства — ' + window.ZM.esc(r.title) + '" loading="lazy"></div>' +
        '<div class="zm-build-card__foot"><b>' + window.ZM.esc(r.title) + '</b><span>' + r.photos.length + ' фото' + '</span></div></button>';
    }).join('') : '<p class="zm-build-empty">За выбранный период фотоотчётов нет.</p>';
  }

  grid.addEventListener('click', function (e) {
    var card = e.target.closest('[data-i]');
    if (!card) return;
    var r = items[+card.getAttribute('data-i')];
    window.ZM.lightbox({ barTitle: 'Ход строительства', title: r.title, images: r.photos, index: 0 });
  });
  selY.addEventListener('change', function () { fillMonths(); sel(selM); render(); });
  selM.addEventListener('change', render);

  function start(list) { items = normalize(list); fillFilters(); render(); }
  function sel(s) { if (window.ZM.initSelect) window.ZM.initSelect(s); s.classList.toggle('is-empty', !s.value); }

  // Пробуем взять фотоотчёты из «Потока» Tilda (обложка + галерея поста)
  function fromFeed() {
    if (!FEED_UID) return Promise.reject();
    var url = 'https://feeds.tildaapi.com/api/getfeed/?feeduid=' + FEED_UID + '&size=100&slice=1&sort%5Bdate%5D=desc&c=' + Date.now();
    return fetch(url).then(function (r) { if (!r.ok) throw 0; return r.json(); }).then(function (data) {
      var posts = data && data.posts;
      if (!posts || !posts.length) throw 0;
      return posts.map(function (p) {
        var photos = [];
        try {
          var g = typeof p.gallery === 'string' ? JSON.parse(p.gallery) : p.gallery;
          (g || []).forEach(function (it) { if (it && (it.img || it.url)) photos.push(it.img || it.url); });
        } catch (e) {}
        if (p.image && photos.indexOf(p.image) < 0) photos.unshift(p.image);
        return { title: p.title, photos: photos };
      });
    });
  }

  start(REPORTS);
  // месяцы из потока заменяют одноимённые из REPORTS, остальные месяцы из REPORTS сохраняются
  fromFeed().then(function (list) {
    var feed = normalize(list); if (!feed.length) return;
    var key = function (r) { return r.year + '-' + r.month; };
    var have = {}; feed.forEach(function (r) { have[key(r)] = 1; });
    items = normalize(feed.concat(items.filter(function (r) { return !have[key(r)]; })));
    fillFilters(); render();
  }, function () {});
})();
</script>
