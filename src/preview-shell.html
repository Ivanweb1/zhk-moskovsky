<script>
  /* Превью: ссылки вида /novosti/... ведут на страницы внутри папки preview */
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[href^="/"]');
    if (!a) return;
    var href = a.getAttribute('href');
    e.preventDefault();
    if (href === '/') { location.href = '{{root}}glavnaya/'; return; }
    if (href.indexOf('/#/') === 0) { location.href = 'https://xn----ctbkblbffabqdhubiarrjde5e2k.xn--p1ai' + href; return; }
    if (href.indexOf('/#') === 0) { location.href = '{{root}}glavnaya/' + href.slice(1); return; }
    if (href.indexOf('/politica') === 0) { alert('Здесь откроется страница политики на сайте'); return; }
    location.href = '{{root}}' + href.replace(/^\//, '').replace(/\/?$/, '/');
  });
</script>
